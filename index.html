<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldGuessr Game</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #errorAlert {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 0, 0, 0.85);
            color: white;
            padding: 15px;
            border-radius: 5px;
            max-width: 400px;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="errorAlert"></div>
    <iframe id="gameFrame" src="https://worldguessr.com"></iframe>

    <script>
        const errorDisplay = document.getElementById("errorAlert");
        const iframe = document.getElementById('gameFrame');

        iframe.addEventListener('load', () => {
            try {
                // 1. This step will immediately fail and jump to the catch block 
                // because browser security blocks accessing cross-origin iframe windows.
                const iframeWindow = iframe.contentWindow || iframe.contentDocument.defaultView;
                
                fetch('https://raw.githubusercontent.com/gabe1031bit-school/testrepo/refs/heads/main/script.js')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.text();
                    })
                    .then(scriptText => {
                        // This will not execute for cross-origin iframes
                        const injectScript = new iframeWindow.Function(scriptText);
                        injectScript();
                    })
                    .catch(err => {
                        showError("Script Fetch/Execution Error: " + err.message);
                    });

            } catch (crossOriginErr) {
                showError("Security Blocked Access: The Same-Origin Policy prevents modifying external websites inside an iframe.");
            }
        });

        function showError(message) {
            errorDisplay.textContent = message;
            errorDisplay.style.display = "block";
            console.error(message);
        }
    </script>
</body>
</html>
